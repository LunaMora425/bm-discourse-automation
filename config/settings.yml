plugins:
  bm_discourse_automation_enabled:
    default: false
    client: true

  bm_ad_cooldown_categories:
    type: category_list
    default: ""

  bm_ad_cooldown_days:
    type: integer
    default: 7
    min: 1

  bm_title_pairing_categories:
    type: category_list
    default: ""

  bm_title_pairing_tag_groups:
    type: tag_group_list
    default: ""

  bm_title_pairing_slash_words:
    type: list
    list_type: compact
    default: "enby"

  bm_archive_category_map:
    client: true
    type: objects
    default: []
    schema:
      name: New Map
      identifier: source_category
      properties:
        source_category:
          type: categories
          label: "Source Category"
          required: true
        archive_category:
          type: categories
          label: "Archive Category"
          required: true
          validations:
            max: 1
        move_closed_to_archive:
          type: boolean
          label: "Also move auto-closed topics to archive"
          default: false
